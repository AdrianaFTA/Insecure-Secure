<!doctype html>
<html>
<head>
    <title>Secure Search</title>
</head>
<body>

<h1>Search Notes (Secure)</h1>

<form method="get">
    <input name="q" placeholder="Search..." value="{{ q }}">
    <button type="submit">Search</button>
</form>

<h3>Results for: {{ q }}</h3>  <!-- Safe: auto-escaped -->

<ul>
    {% for n in results %}
        <li>{{ n[0] }}</li>  <!-- Safe: Jinja escapes HTML -->
    {% endfor %}
</ul>

<br>
<a href="/">Back to Main Page</a>
<br>
<a href="/notes">Back to Notes</a>

</body>
</html>
