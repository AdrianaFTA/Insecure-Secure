<!doctype html>
<html>
<head>
    <title>Insecure Search</title>
</head>
<body>

<h1>Search Notes (Insecure)</h1>
<br>
<a href="/logout">Logout</a>

<form method="get">
    <input name="q" placeholder="Search..." value="{{ q }}">
    <button type="submit">Search</button>
</form>

<h3>Results for: {{ q|safe }}</h3>  <!-- Reflected XSS -->

<ul>
    {% for n in results %}
        <li>{{ n[0]|safe }}</li>   <!-- Stored XSS -->
    {% endfor %}
</ul>

<br>
<a href="/">Back to Main Page</a>
<br>
<a href="/notes">Back to Notes</a>

</body>
</html>
